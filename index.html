<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMDB Movie App - Dark Mode</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

    <!-- Navbar & Search -->
    <nav class="navbar sticky-top navbar-dark bg-black shadow-lg">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger" href="#" onclick="location.reload()">CINE<span class="text-white">FLIX</span></a>
            
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar película...">
                <!-- BOTÓN CORREGIDO CON CLASES DE CENTRADO E ICONO BI-SEARCH -->
                <button class="search-btn d-flex align-items-center justify-content-center">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="container my-5">
        <h2 id="sectionTitle" class="fw-light">Películas <span class="fw-bold text-danger">Populares</span></h2>
    </header>

    <!-- Movies Grid -->
    <main class="container">
        <div id="movieGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            <!-- Las tarjetas se cargan dinámicamente aquí -->
        </div>

        <!-- Pagination -->
        <nav class="my-5">
            <ul class="pagination justify-content-center custom-pagination">
                <li class="page-item"><button class="page-link" id="prevPage">Anterior</button></li>
                <li class="page-item disabled"><span class="page-link" id="currentPage">1</span></li>
                <li class="page-item"><button class="page-link" id="nextPage">Siguiente</button></li>
            </ul>
        </nav>
    </main>

    <script src="script.js"></script>
</body>
</html>

    <script src="script.js"></script>
</body>
</html>
